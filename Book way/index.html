<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Book Library</title>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-5 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
            <h1 class="display-4 my-4 ">Book Library</h1>
            <button class="btn btn-dark" id="clear">Clear All</button>
        </div>
        <div class="show-alert">
        </div>
        <form id="book-form" class="mb-4 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
        <div class="form-floating mb-4">
            <input type="text" class="form-control" id="title" placeholder="">
            <label for="title">Title</label>
        </div>
         <div class="form-floating mb-4">
            <input type="text" class="form-control" id="author" placeholder="">
            <label for="author">Author</label>
        </div>
         <div class="form-floating mb-4">
            <input type="number" class="form-control" id="isbn" placeholder="">
            <label for="isbn">isbn</label>
        </div>
        <button type="submit" class="btn btn-dark" id="test">Add</button>
    </form>
    <table class="table table-hover col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>isbn</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="book-list">
            <tr>
                <td>Web dev</td>
                <td>Kalam</td>
                <td>2211</td>
                <td class="delete"><span class="btn btn-danger">X</span></td>
            </tr>
        </tbody>
    </table>
    </div>
    

    <script src="./javaScript/es6-app.js"></script>
</body>
</html>
