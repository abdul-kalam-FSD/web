<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
      <link rel="stylesheet" href="./style.css">

</head>
<body>
    <nav>
        <div class="nav-wrapper cyan darken-4">
            <div class="container">
                <a href="#" class="brand-logo center">Money Tracker</a>
                <ul class="right">
                    <li><a href="#" class="btn clear-btn teal darken-1">clear All</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-content">
                <div class="card-title">Add Task and Money</div>
                <form>
                    <div class="row">
                        <div class="input-field col-6">
                            <input type="text" placeholder="Add item" id="item-name">
                        </div>
                        <div class="input-field col-6">
                            <input type="number" placeholder="Add Money" id="item-money">
                        </div>
                    </div>
                    <button class="add-btn btn teal darken-1"><i class="fa-solid fa-plus"></i>Add Task</button>
                    <button class="update-btn btn orange darken-1"><i class="fa-solid fa-square-pen"></i>Update Task</button>
                    <button class="delete-btn btn red darken-1"><i class="fa-solid fa-x"></i>Delete Task</button>
                    <button class="back-btn btn grey darken-1"><i class="fa-solid fa-angle-left"></i>back</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <h3 class="center-align">Total Money : <span class="total-money">0</span></h3>
        <ul id="item-list" class="collection">
            <!-- <li class="collection-item" id="item-1">
                <strong>Bike</strong> : <em>300000 rs</em>
                <a href="#" class="secondary-content"><i class="fa-solid fa-pencil edit-item"></i></a>
            </li> -->
        </ul>
    </div>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <!-- <script src="./javaScript/module.js"></script> -->
        <script src="./javaScript/app.js"></script>
</body>
</html>
